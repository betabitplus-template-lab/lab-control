name: Template system final audit lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copier-matrix.yml
      - .github/workflows/template-system-hardening-lab.yml
      - .github/workflows/template-system-final-audit-lab.yml
      - acceptance/copier_matrix.py
      - experiments/template_system_final_audit_lab.py
      - evidence/template-system-hardening-20260801/**
      - evidence/template-system-final-audit-20260801/**

permissions:
  contents: read

jobs:
  final-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout lab control
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install exact audit tools
        run: python -m pip install uv==0.12.0 copier==9.17.0 PyYAML==6.0.3

      - name: Run controlled Copier matrix
        run: python acceptance/copier_matrix.py

      - name: Audit final template-system contracts
        run: |
          python experiments/template_system_final_audit_lab.py \
            --hardening-evidence evidence/template-system-hardening-20260801 \
            --matrix-result docs/results/copier-matrix.json \
            --output-dir evidence/template-system-final-audit-20260801

      - name: Verify committed evidence is reproducible
        run: git diff --exit-code -- evidence/template-system-final-audit-20260801

      - name: Publish summary
        run: cat evidence/template-system-final-audit-20260801/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-system-final-audit-${{ matrix.os }}
          path: evidence/template-system-final-audit-20260801
          if-no-files-found: error
          retention-days: 90
