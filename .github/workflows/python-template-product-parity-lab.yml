name: Python template product parity lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/python-template-product-parity-lab.yml
      - experiments/python_template_product_parity_lab.py
      - evidence/python-template-product-parity-20260731/**

permissions:
  contents: read

jobs:
  product-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout lab control
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Checkout frozen py-lib-starter
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          repository: betabitplus/py-lib-starter
          ref: d59582375855cff69fb165e467dc5847bc75ca99
          path: .lab/py-lib-starter
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install exact uv
        run: python -m pip install uv==0.12.0

      - name: Install system linters used by retained product hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -fsSL \
            -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
          shellcheck --version
          hadolint --version

      - name: Render and verify complete Python-library product
        run: |
          uv run --python 3.13 --with copier==9.16.0 python \
            experiments/python_template_product_parity_lab.py \
            --baseline-root .lab/py-lib-starter \
            --work-dir "$RUNNER_TEMP/python-template-product-parity" \
            --snapshot-dir evidence/python-template-product-parity-20260731/rendered-sample \
            --evidence-json evidence/python-template-product-parity-20260731/result.json \
            --evidence-md evidence/python-template-product-parity-20260731/report.md

      - name: Verify committed evidence is reproducible
        run: git diff --exit-code -- evidence/python-template-product-parity-20260731

      - name: Publish summary
        run: cat evidence/python-template-product-parity-20260731/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete rendered candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-template-product-parity-20260731
          path: evidence/python-template-product-parity-20260731
          if-no-files-found: error
          retention-days: 90
