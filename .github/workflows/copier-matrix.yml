name: Copier update matrix

on:
  push:
    branches: [main]
    paths:
      - acceptance/copier_matrix.py
      - docs/results/copier-matrix.json
      - .github/workflows/copier-matrix.yml
  pull_request:
    paths:
      - acceptance/copier_matrix.py
      - docs/results/copier-matrix.json
      - .github/workflows/copier-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout lab control
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install exact Copier
        run: python -m pip install "copier==9.17.0"

      - name: Run update contract
        run: python acceptance/copier_matrix.py

      - name: Verify committed result
        run: git diff --exit-code -- docs/results/copier-matrix.json
